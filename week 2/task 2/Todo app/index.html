<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple, focused to-do list that saves your tasks locally.">
  <title>Daylist | To-do</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="app-card" aria-labelledby="page-title">
      <header class="app-header">
        <div>
          <p class="eyebrow">Your daily space</p>
          <h1 id="page-title">daylist<span>.</span></h1>
        </div>
        <div class="date-block" aria-label="Today's date">
          <span id="current-day"></span>
          <strong id="current-date"></strong>
        </div>
      </header>

      <div class="intro">
        <h2>Make room<br><em>for what matters.</em></h2>
        <p>One small step at a time. Keep your focus close and your list lighter.</p>
      </div>

      <form class="add-form" id="add-form">
        <label class="sr-only" for="task-input">Add a new task</label>
        <input id="task-input" type="text" maxlength="120" placeholder="What needs doing?" autocomplete="off" required>
        <button type="submit">Add task <span aria-hidden="true">↗</span></button>
      </form>

      <div class="toolbar">
        <div class="filter-group" role="group" aria-label="Filter tasks">
          <button class="filter-button is-active" type="button" data-filter="all">All <span data-count="all">0</span></button>
          <button class="filter-button" type="button" data-filter="active">Open <span data-count="active">0</span></button>
          <button class="filter-button" type="button" data-filter="completed">Done <span data-count="completed">0</span></button>
        </div>
        <button class="clear-button" id="clear-completed" type="button">Clear completed</button>
      </div>

      <ul class="task-list" id="task-list" aria-live="polite"></ul>
      <div class="empty-state" id="empty-state">
        <span class="empty-mark">✳</span>
        <p id="empty-message">Your list is clear.<br>Add something worth doing.</p>
      </div>

      <footer class="app-footer">
        <span><i class="status-dot"></i><span id="task-summary">0 tasks left</span></span>
        <span>Saved on this device</span>
      </footer>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
